<script>
(function () {
  var P = JSON.parse(document.getElementById("payload").textContent);
  var NAME = "radar-key-" + P.kid;
  var f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(u) { var s = ""; u.forEach(function (x) { s += String.fromCharCode(x); }); return btoa(s); }
  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function show(msg) { f.hidden = false; err.textContent = msg || ""; document.getElementById("pw").focus(); }

  if (!window.crypto || !crypto.subtle) { show("이 브라우저에서는 열 수 없습니다. 최신 크롬·사파리로 열어 주세요."); return; }

  function decrypt(raw) {
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
    }).then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, 256);
      }).then(function (bits) { return new Uint8Array(bits); });
  }
  // 잠금 화면을 다 그린 뒤에 바꿔 끼운다. 그리기 도중에 document.open()을 부르면
  // 브라우저가 교체 대신 이어 붙여 잠금 화면과 대시보드가 겹친다(기억된 키로 바로 열 때).
  function render(html) {
    function swap() { document.open(); document.write(html); document.close(); }
    if (document.readyState === "complete") swap();
    else window.addEventListener("load", swap, { once: true });
  }

  var cached = load(NAME);
  if (cached) {
    decrypt(b64(cached)).then(render, function () { store(NAME, null); show(); });
  } else {
    show();
  }

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    go.disabled = true; err.textContent = "여는 중…";
    var raw;
    derive(document.getElementById("pw").value).then(function (r) { raw = r; return decrypt(raw); })
      .then(function (html) {
        if (document.getElementById("remember").checked) store(NAME, toB64(raw));
        render(html);
      }, function () { go.disabled = false; err.textContent = "비밀번호가 다릅니다."; });
  });
})();
</script>
